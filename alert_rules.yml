# Prometheus Alert Rules for Adaptive Threat Modeler
groups:
  - name: backend_alerts
    interval: 30s
    rules:
      # Service availability
      - alert: BackendServiceDown
        expr: up{job="threat-modeler-backend"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Backend service is down"
          description: "The threat modeler backend has been down for more than 1 minute"

      # High error rate
      - alert: HighErrorRate
        expr: rate(errors_total[5m]) > 10
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "High error rate detected"
          description: "Error rate is {{ $value }} errors/sec (threshold: 10)"

      # Analysis failures
      - alert: HighAnalysisFailureRate
        expr: rate(analysis_total{status="failed"}[10m]) / rate(analysis_total[10m]) > 0.2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High analysis failure rate"
          description: "{{ $value | humanizePercentage }} of analyses are failing"

      # Performance degradation
      - alert: HighAPILatency
        expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[5m])) > 5
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "High API latency detected"
          description: "95th percentile latency is {{ $value }}s (threshold: 5s)"

      # Resource exhaustion
      - alert: HighMemoryUsage
        expr: memory_usage_bytes / 1073741824 > 4
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High memory usage"
          description: "Memory usage is {{ $value }}GB (threshold: 4GB)"

      - alert: HighGoroutineCount
        expr: active_goroutines > 1000
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "High number of goroutines"
          description: "Goroutine count is {{ $value }} (threshold: 1000)"

      # Analysis queue buildup
      - alert: AnalysisQueueBacklog
        expr: analysis_queue_depth > 50
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Analysis queue backlog"
          description: "{{ $value }} analyses are waiting in queue (threshold: 50)"

      # Long-running analyses
      - alert: LongRunningAnalyses
        expr: analysis_in_progress > 10
        for: 30m
        labels:
          severity: info
        annotations:
          summary: "Multiple long-running analyses"
          description: "{{ $value }} analyses have been running for over 30 minutes"

      # Repository clone failures
      - alert: RepositoryCloneFailures
        expr: rate(repository_clone_total{status="failure"}[10m]) > 0.1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High repository clone failure rate"
          description: "Repository clones are failing at {{ $value }} failures/sec"

      # Critical vulnerabilities detected
      - alert: CriticalVulnerabilitiesDetected
        expr: increase(vulnerabilities_detected_total{severity="critical"}[1h]) > 100
        for: 5m
        labels:
          severity: info
        annotations:
          summary: "High number of critical vulnerabilities detected"
          description: "{{ $value }} critical vulnerabilities detected in the last hour"

  - name: system_alerts
    interval: 30s
    rules:
      # GC pressure
      - alert: HighGCPauseDuration
        expr: histogram_quantile(0.99, rate(gc_pause_duration_seconds_bucket[5m])) > 0.1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "High GC pause duration"
          description: "99th percentile GC pause is {{ $value }}s (threshold: 0.1s)"

      # Request volume spike
      - alert: RequestVolumeSpike
        expr: rate(http_requests_total[5m]) > 1000
        for: 5m
        labels:
          severity: info
        annotations:
          summary: "Request volume spike detected"
          description: "Request rate is {{ $value }} req/sec (threshold: 1000)"
