# Prometheus Configuration for Adaptive Threat Modeler
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'adaptive-threat-modeler'
    environment: 'production'

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets: []
          # - 'alertmanager:9093'

# Load rules once and periodically evaluate them
rule_files:
  - 'alert_rules.yml'

# Scrape configurations
scrape_configs:
  # Backend API monitoring (running locally on host)
  - job_name: 'threat-modeler-backend'
    scrape_interval: 10s
    metrics_path: '/metrics'
    static_configs:
      - targets: ['host.docker.internal:8080']
        labels:
          service: 'backend'
          component: 'api'
    
  # Self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
        labels:
          service: 'prometheus'
