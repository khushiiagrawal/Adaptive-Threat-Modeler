apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "threat-modeler.labels" . | nindent 4 }}
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
    
    rule_files:
      - /etc/prometheus/alert_rules.yml
    
    scrape_configs:
      - job_name: 'threat-modeler-backend'
        scrape_interval: 10s
        metrics_path: '/metrics'
        static_configs:
          - targets: ['backend:8080']
            labels:
              service: 'backend'
              component: 'api'
      
      - job_name: 'prometheus'
        static_configs:
          - targets: ['localhost:9090']

  alert_rules.yml: {{ .Files.Get "files/alert_rules.yml" | quote }}
