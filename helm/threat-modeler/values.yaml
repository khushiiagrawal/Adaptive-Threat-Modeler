# Default values for threat-modeler
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# Global settings
global:
  # Image pull secrets if using private registry
  imagePullSecrets: []

# Backend configuration
backend:
  replicaCount: 1
  
  image:
    repository: khushiiagrawal/threat-modeler-backend
    tag: v1.0.0
    pullPolicy: Always
  
  # Resource limits
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "500m"
  
  # Service configuration
  service:
    type: ClusterIP
    port: 8080
  
  # Environment variables
  config:
    port: "8080"
    maxFileSize: "10485760"
    enableDataflowAnalysis: "true"
    logLevel: "info"

# Frontend configuration
frontend:
  replicaCount: 2
  
  image:
    repository: khushiiagrawal/threat-modeler-frontend
    tag: v1.0.3
    pullPolicy: Always
  
  resources:
    requests:
      memory: "64Mi"
      cpu: "50m"
    limits:
      memory: "128Mi"
      cpu: "200m"
  
  service:
    type: ClusterIP
    port: 80

# Ingress configuration
ingress:
  enabled: true
  className: nginx
  host: threat-modeler.local
  annotations: {}
    # nginx.ingress.kubernetes.io/ssl-redirect: "false"

# Namespace
namespace: threat-modeler
