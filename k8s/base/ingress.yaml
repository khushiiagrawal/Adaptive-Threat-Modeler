# Ingress - Routes external traffic to frontend and backend
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: threat-modeler-ingress
  namespace: threat-modeler
  labels:
    app: threat-modeler
  annotations:
    # Allow large file uploads (100MB for zip files)
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
    # Increase timeouts for long-running analysis
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
spec:
  ingressClassName: nginx
  rules:
  - host: threat-modeler.local
    http:
      paths:
      # API routes go to backend (more specific paths first)
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: backend
            port:
              number: 8080
      - path: /health
        pathType: Prefix
        backend:
          service:
            name: backend
            port:
              number: 8080
      - path: /metrics
        pathType: Prefix
        backend:
          service:
            name: backend
            port:
              number: 8080
      # Everything else goes to frontend
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend
            port:
              number: 80
