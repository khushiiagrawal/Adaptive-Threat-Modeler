# Ingress - Routes external traffic to frontend and backend
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: threat-modeler-ingress
  namespace: threat-modeler
  labels:
    app: threat-modeler
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
  - host: threat-modeler.local
    http:
      paths:
      # API routes go to backend
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: backend
            port:
              number: 8080
      - path: /health
        pathType: Prefix
        backend:
          service:
            name: backend
            port:
              number: 8080
      - path: /metrics
        pathType: Prefix
        backend:
          service:
            name: backend
            port:
              number: 8080
      # Everything else goes to frontend
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend
            port:
              number: 80
