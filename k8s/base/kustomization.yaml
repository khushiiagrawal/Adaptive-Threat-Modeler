# Kustomization file - apply all resources in order
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: threat-modeler

resources:
  - namespace.yaml
  - backend-configmap.yaml
  - backend.yaml
  - frontend.yaml
  - ingress.yaml

commonLabels:
  project: adaptive-threat-modeler
