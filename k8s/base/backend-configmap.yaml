# Backend ConfigMap - Environment configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: threat-modeler
  labels:
    app: backend
data:
  # Server Configuration
  PORT: "8080"
  TEMP_DIR: "/tmp"
  
  # Security Configuration
  MAX_FILE_SIZE: "104857600"  # 100MB in bytes
  ALLOWED_ORIGINS: "http://localhost:3000,http://localhost:5173"
  
  # Analysis Configuration
  ENABLE_DATAFLOW_ANALYSIS: "true"
  MAX_ANALYSIS_TIME: "300"  # 5 minutes in seconds
  CONCURRENT_ANALYSES: "5"
  
  # Logging
  LOG_LEVEL: "info"
  LOG_FORMAT: "json"
